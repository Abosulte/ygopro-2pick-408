# ============================================================
# nginx 反代参考片段（在反代机的 /etc/nginx/nginx.conf 的 stream { } 块内追加）
#
# 用法：把 <主服IP> 换成你自己的实际地址再使用，例如
#   sed 's/<主服IP>/10.0.0.5/g' nginx-4082.snippet.conf >> /etc/nginx/nginx.conf
#   nginx -t && systemctl restart nginx
#
# 同时把反代机的公网 IP 填进部署包 deploy.env 的 PROXY_IP；
# deploy.sh 会自动生成 trusted_proxies（v4 与 ::ffff: 映射两种形式）。
#
# 注意：srvpro 不解析 PROXY Protocol，切勿开 proxy_protocol on。
# ============================================================

    upstream ygo_2pick_4082 {
        server <主服IP>:4082;
    }
    server {
        listen 4082;
        proxy_pass ygo_2pick_4082;
        proxy_timeout 24h;
        proxy_connect_timeout 10s;
    }
